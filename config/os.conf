# Astrix OS - central build configuration
# Sourced by every build script. Keep this file free of logic.

# --- Identity ---------------------------------------------------------------
OS_NAME="astrix"
OS_PRETTY_NAME="Astrix OS"
OS_VERSION="0.1.0"
OS_ID="astrix"
OS_BUILD_DATE="1970-01-01"   # pinned for reproducibility; override for dev builds

# --- Target architecture ----------------------------------------------------
ASTRIX_ARCH="arm64"
DEB_ARCH="arm64"
DEB_TRIPLET="aarch64-linux-gnu"
QEMU_SYSTEM="qemu-system-aarch64"
QEMU_CPU="max"                # 'max' gives the most feature-complete ARM64 model in TCG

# --- Base distribution ------------------------------------------------------
# Minimal Debian. NOT Ubuntu, NOT Alpine, NOT Arch, NOT postmarketOS, NOT Android.
DEBIAN_SUITE="trixie"
DEBIAN_MIRROR="http://deb.debian.org/debian"
DEBIAN_SECURITY_MIRROR="http://deb.debian.org/debian-security"
DEBIAN_VARIANT="minbase"
# The kernel shipped in the target suite. Used for the QEMU milestone so that
# the OS is bootable before the in-tree kernel is available.
DEBIAN_KERNEL_PACKAGE="linux-image-arm64"

# --- Repository versions (pinned for reproducibility) -----------------------
KERNEL_VERSION="6.12.107"
KERNEL_URL="https://cdn.kernel.org/pub/linux/kernel/v6.x"
# wlroots 0.18 is what Debian trixie ships; the compositor targets this API.
WLROOTS_ABI="0.18"

# --- Display / graphics defaults -------------------------------------------
# 720x1600 is a realistic modern-phone portrait panel. virtio-gpu in QEMU can
# drive it; on real hardware this is overridden per device.
ASTRIX_PORTRAIT_WIDTH=720
ASTRIX_PORTRAIT_HEIGHT=1600
ASTRIX_SCALE=1
ASTRIX_REFRESH_HZ=60

# --- Runtime users ----------------------------------------------------------
# The GUI/shell runs as an unprivileged user. Only specific helpers are root.
ASTRIX_USER="astrix"
ASTRIX_UID=1000
ASTRIX_GID=1000
ASTRIX_HOME="/home/astrix"

# --- Android compatibility (Waydroid) --------------------------------------
ASTRIX_ANDROID_ENABLED="true"
ASTRIX_WAYDROID_IMAGE="waydroid-base"

# --- Build behaviour --------------------------------------------------------
# SOURCE_DATE_EPOCH makes the build reproducible.
export SOURCE_DATE_EPOCH="${SOURCE_DATE_EPOCH:-1704067200}"
BUILD_JOBS="${BUILD_JOBS:-$(nproc 2>/dev/null || echo 2)}"
