# Astrix OS - device profile: Xiaomi Redmi 8A  (codename "olive")
#
# Read this before assuming anything works on this phone. The short version:
# this profile is REAL - the hardware facts below are correct - but the
# software port does not exist yet, and the parts that do not exist are listed
# explicitly under "STATUS" rather than left to be discovered at 2am with the
# phone in fastboot.
#
# Consumed by scripts/build-device.sh and scripts/flash-device.sh.

# --- identity ---------------------------------------------------------------
DEVICE_NAME="Redmi 8A"
DEVICE_CODENAME="olive"
DEVICE_VENDOR="Xiaomi"
DEVICE_YEAR="2020"
DEVICE_SOC_VENDOR="Qualcomm"
DEVICE_SOC="MSM439 (Snapdragon 439)"
DEVICE_ARCH="arm64"

# --- panel ------------------------------------------------------------------
# From the device's own device tree in the LineageOS tree (olive):
#   mdss,dsi-panel: 720x1520, 30fps, 20-bit PPI
DEVICE_PANEL_WIDTH=720
DEVICE_PANEL_HEIGHT=1520
DEVICE_PANEL_REFRESH=60

# --- display link budget ----------------------------------------------------
# What the panel physically demands of the DSI link. This is arithmetic, and
# it is the first gate on the bring-up: a MIPI DSI link cannot carry a panel it
# does not have the bits for, no matter how good the driver is.
##   720x1520 @ 60Hz  ->  79.5 MHz pixel clock (with 10%/10% blanking)
#                    ->  1.91 Gbit/s payload at 24bpp
#                    ->  477 Mbit/s per lane on 4 lanes
#                    ->  81% headroom against a 2.5 Gbit/s lane
#
# The link is nowhere near its limit. That matters, because it means bandwidth
# is NOT this device's problem: the Adreno 505 simply has no mainline driver,
# and no amount of link capacity would change that. A comfortable budget does
# not make a missing driver appear. It does mean that if a driver is ever
# obtained, the panel side is the easy half.
#
# PROVENANCE - read this before trusting any of it:
#   W/H/refresh      device tree values from the reference kernel (verified)
#   blanking %       ASSUMED, not measured. No porch values have been read out
#                    of a working boot because there has never been one. Pixel
#                    rate scales linearly with blanking.
#   lanes / rate     the values the reference port's device tree uses for this
#                    SoC; NOT measured on Astrix hardware.
DEVICE_DSI_LANES=4
DEVICE_DSI_MAX_LINK_RATE=2500000000
DEVICE_DSI_BPP=24
DEVICE_PANEL_HBLANK_PERCENT=10
DEVICE_PANEL_VBLANK_PERCENT=10
DEVICE_DISPLAY_DATA_PROVENANCE="resolution/refresh: reference kernel device tree; blanking: ASSUMED (10%/10%); DSI lanes and per-lane rate: reference port's device tree, not measured"

# --- graphics ---------------------------------------------------------------
# Adreno 505. Mainline has NO open DRM driver for Adreno 5xx: the only driver
# is the closed kms/kgsl blob that ships in the vendor tree, and it needs the
# downstream kernel, not ours. See STATUS below.
DEVICE_GPU="Adreno 505"
DEVICE_GPU_DRIVER_MAINLINE="none"
DEVICE_GPU_DRIVER_REQUIRED="msm (downstream, closed Adreno 5xx userspace)"

# --- bootloader -------------------------------------------------------------
# Xiaomi's bootloader is locked, and unlocking requires the Mi Unlock tool,
# a Xiaomi account bound to the device, and a waiting period (commonly 72h
# or more, and it has been extended without notice). Nothing Astrix does can
# shorten that.
DEVICE_BOOTLOADER_UNLOCK="mi-unlock (Xiaomi account, waiting period, Windows tool)"
DEVICE_BOOTLOADER_FASTBOOT="yes (after unlock)"
DEVICE_ROOT_REQUIRED="no"
DEVICE_DTBO_PARTITION="yes"

# --- storage / partitions ---------------------------------------------------
DEVICE_PARTITION_SCHEME="A/B (a/b, system_a/system_b, dtbo_a/dtbo_b)"
DEVICE_SUPER_PARTITION="yes"

# --- storage / SoC drivers that upstream Linux actually has -----------------
# Each of these is a real CONFIG_ symbol that scripts/device.sh check verifies
# is enabled in config/kernel/config. If the check fails, the port cannot boot
# for a reason that is already known at build time rather than at 2am.
#
# The display-path symbols are listed even though this device is blocked on a
# missing driver rather than a missing option. They are what the MSM/KMSL
# display path needs the moment a driver exists, and having device.sh check
# them means the config gap is caught before the driver work starts instead of
# after it.
DEVICE_REQUIRED_KERNEL_FEATURES="ufshc,ufs-qcom,phy-qcom-qmp,regulator-qcom-rpmh,watchdog-qcom-wdt,clk-qcom,thermal-qcom,phy-qcom-qcom-mmp,drm-mipi-dsi,drm-mipi-dsi-phy,drm-panel-of,drm-panel-bridge,drm-fbdev,uart-msm,earlycon"

# --- and the ones upstream does NOT have ------------------------------------
# These are the reason this device is unsupported. They are not "forgotten
# config options" - the code does not exist in mainline, so no .config can
# bring them to life. Recording them separately is what stops this from
# looking like a configuration problem that someone could just fix.
DEVICE_DOWNSTREAM_ONLY_FEATURES="msm-adreno505-display,msm-dsi-panel,mmc-sdhci-msm,olive-device-tree"

# --- status -----------------------------------------------------------------
# HONEST STATUS, as of this commit:
#   boot:   NOT SUPPORTED
#   reason: (1) no mainline display driver exists for Adreno 505, so there is
#              no way to light the panel with an upstream kernel - this is a
#              missing-driver problem, not a missing-config one;
#           (2) there is no upstream device tree for olive, so there is no
#              description of this board's regulators, clocks, PHYs or
#              interrupt wiring for a board file to be written against;
#           (3) the bootloader is locked and unlocking is gated on a vendor
#              account and a waiting period.
#
# A "supported" claim for this device would be a lie. What IS done here is the
# part that can be done honestly: the hardware is specified, the required
# kernel features are enumerated, and the build/flash tooling will refuse to
# claim success until a boot has actually been observed.
DEVICE_BOOT_STATUS="unsupported"
DEVICE_BOOT_BLOCKERS="no-mainline-display-driver,no-mainline-dt,locked-bootloader"
DEVICE_VERIFIED_BOOT="no"

# Notes for whoever does the port. Start from a known-working community port
# rather than from nothing:
#   - postmarketOS has an "olive" port; its kernel config is the realistic
#     starting point for the downstream driver set.
#   - LineageOS's kernel for olive is the other reference.
# Neither is Astrix's kernel, and shipping either would mean shipping someone
# else's work under Astrix's name. What Astrix would contribute is the
# userspace above it.
DEVICE_PORT_REFERENCES="postmarketOS olive port, LineageOS kernel_olive"