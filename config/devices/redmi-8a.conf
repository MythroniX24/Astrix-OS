# Astrix OS - device profile: Xiaomi Redmi 8A  (codename "olive")
#
# Read this before assuming anything works on this phone. The short version:
# this profile is REAL - the hardware facts below are correct - but the
# software port does not exist yet, and the parts that do not exist are listed
# explicitly under "STATUS" rather than left to be discovered at 2am with the
# phone in fastboot.
#
# Consumed by scripts/build-device.sh and scripts/flash-device.sh.

# --- identity ---------------------------------------------------------------
DEVICE_NAME="Redmi 8A"
DEVICE_CODENAME="olive"
DEVICE_VENDOR="Xiaomi"
DEVICE_YEAR="2020"
DEVICE_SOC_VENDOR="Qualcomm"
DEVICE_SOC="MSM439 (Snapdragon 439)"
DEVICE_ARCH="arm64"

# --- panel ------------------------------------------------------------------
# From the device's own device tree in the LineageOS tree (olive):
#   mdss,dsi-panel: 720x1520, 30fps, 20-bit PPI
DEVICE_PANEL_WIDTH=720
DEVICE_PANEL_HEIGHT=1520
DEVICE_PANEL_REFRESH=60

# --- display link budget ----------------------------------------------------
# What the panel physically demands of the DSI link. This is arithmetic, and
# it is the first gate on the bring-up: a MIPI DSI link cannot carry a panel it
# does not have the bits for, no matter how good the driver is.
##   720x1520 @ 60Hz  ->  79.5 MHz pixel clock (with 10%/10% blanking)
#                    ->  1.91 Gbit/s payload at 24bpp
#                    ->  477 Mbit/s per lane on 4 lanes
#                    ->  81% headroom against a 2.5 Gbit/s lane
#
# The link is nowhere near its limit. That matters, because it means bandwidth
# is NOT this device's problem: the Adreno 505 simply has no mainline driver,
# and no amount of link capacity would change that. A comfortable budget does
# not make a missing driver appear. It does mean that if a driver is ever
# obtained, the panel side is the easy half.
#
# PROVENANCE - read this before trusting any of it:
#   W/H/refresh      device tree values from the reference kernel (verified)
#   blanking %       ASSUMED, not measured. No porch values have been read out
#                    of a working boot because there has never been one. Pixel
#                    rate scales linearly with blanking.
#   lanes / rate     the values the reference port's device tree uses for this
#                    SoC; NOT measured on Astrix hardware.
DEVICE_DSI_LANES=4
DEVICE_DSI_MAX_LINK_RATE=2500000000
DEVICE_DSI_BPP=24
DEVICE_PANEL_HBLANK_PERCENT=10
DEVICE_PANEL_VBLANK_PERCENT=10
DEVICE_DISPLAY_DATA_PROVENANCE="resolution/refresh: reference kernel device tree; blanking: ASSUMED (10%/10%); DSI lanes and per-lane rate: reference port's device tree, not measured"

# --- graphics ---------------------------------------------------------------
# Adreno 505. Mainline has NO open DRM driver for Adreno 5xx: the only driver
# is the closed kms/kgsl blob that ships in the vendor tree, and it needs the
# downstream kernel, not ours. See STATUS below.
DEVICE_GPU="Adreno 505"
DEVICE_GPU_DRIVER_MAINLINE="none"
DEVICE_GPU_DRIVER_REQUIRED="msm (downstream, closed Adreno 5xx userspace)"

# --- bootloader -------------------------------------------------------------
# Xiaomi's bootloader is locked, and unlocking requires the Mi Unlock tool,
# a Xiaomi account bound to the device, and a waiting period (commonly 72h
# or more, and it has been extended without notice). Nothing Astrix does can
# shorten that.
DEVICE_BOOTLOADER_UNLOCK="mi-unlock (Xiaomi account, waiting period, Windows tool)"
DEVICE_BOOTLOADER_FASTBOOT="yes (after unlock)"
DEVICE_ROOT_REQUIRED="no"
DEVICE_DTBO_PARTITION="yes"

# --- storage / partitions ---------------------------------------------------
DEVICE_PARTITION_SCHEME="A/B (a/b, system_a/system_b, dtbo_a/dtbo_b)"
DEVICE_SUPER_PARTITION="yes"

# --- storage / SoC drivers that upstream Linux actually has -----------------
# Each of these is a real CONFIG_ symbol that scripts/device.sh check verifies
# is enabled in config/kernel/config. If the check fails, the port cannot boot
# for a reason that is already known at build time rather than at 2am.
#
# The display-path symbols are listed even though this device is blocked on a
# missing driver rather than a missing option. They are what the MSM/KMSL
# display path needs the moment a driver exists, and having device.sh check
# them means the config gap is caught before the driver work starts instead of
# after it.
DEVICE_REQUIRED_KERNEL_FEATURES="ufshc,ufs-qcom,phy-qcom-qmp,regulator-qcom-rpmh,watchdog-qcom-wdt,clk-qcom,thermal-qcom,phy-qcom-qcom-mmp,drm-mipi-dsi,drm-mipi-dsi-phy,drm-panel-of,drm-panel-bridge,drm-fbdev,uart-msm,earlycon"

# --- and the ones upstream does NOT have ------------------------------------
# These are the reason this device is unsupported. They are not "forgotten
# config options" - the code does not exist in mainline, so no .config can
# bring them to life. Recording them separately is what stops this from
# looking like a configuration problem that someone could just fix.
DEVICE_DOWNSTREAM_ONLY_FEATURES="msm-adreno505-display,msm-dsi-panel,mmc-sdhci-msm,olive-device-tree"

# --- VERIFIED 2026-10-04: the vendor kernel, and what it actually wires up ---
# Checked against the real repository, not from memory. Read from
#   https://github.com/redmi8a/android_kernel_xiaomi_olive (branch master),
# which is the obvious source but CANNOT be built - it is missing all 1451 .S
# files. Its non-assembly content is identical to the tree actually built here,
# so the findings below hold, and the buildable mirror is recorded further down
# as DEVICE_VENDOR_KERNEL_REPO.
#
# What is IN there, confirmed by reading the tree:
#   - Linux 4.9.112 "Roaring Lionus"
#   - arch/arm64/configs/olive-perf_defconfig
#   - a complete BOARD description for olive that mainline does not have:
#     msm8937-olive.dtsi, msm8937-pinctrl-olive.dtsi, msm8937-mdss-pll-olive.dtsi,
#     msm8937-mdss-panels.dtsi
#   - the Adreno 505, explicitly: adreno-gpulist.h lists ADRENO_REV_A505 (0.0.5.x)
#   - the MDSS display stack, with DRM/KMS bindings under drivers/gpu/drm/msm/
#
# What the SHIPPED defconfig actually enables, and why this matters:
#   CONFIG_QCOM_KGSL=y               the GPU as a render HAL, not a DRM device
#   CONFIG_FB_MSM_MDSS=y             display via FRAMEBUFFER
#   CONFIG_MSM_MDSS_PLL=y
#   ...and NOT CONFIG_DRM_MSM.
#
# So the kernel can light this phone's screen, but it lights it the way Android
# does - through a framebuffer, not through modesetting. wlroots' DRM backend
# needs a KMS device and will not find one here as configured.
#
# That is a bounded engineering task, not a dead end: enable DRM_MSM, port the
# MDSS DSI/panel nodes onto the DRM msm bindings, and the compositor has what it
# needs. It is emphatically NOT the same task as writing an Adreno 505 driver
# from scratch, which is what mainline would require.
#
# Corroborating evidence, and it is not encouraging: postmarketOS's own tracker
# (pmaports#4119) says there is no working DSI driver for SDM439 and that only
# the simplefb path works. Ten years in, the mainline route has not landed.
# The obvious repo, redmi8a/android_kernel_xiaomi_olive, CANNOT be built: it is
# missing all 1451 .S assembly files (entry.S, head.S, the vDSO). Its GitHub
# contents API returns 404 for those paths and its file list differs from
# upstream v4.9.112 by exactly them. Verified by attempting a build, which dies
# at "No rule to make target arch/arm64/kernel/vdso/vdso.lds".
DEVICE_VENDOR_KERNEL_REPO_BAD="https://github.com/redmi8a/android_kernel_xiaomi_olive (incomplete: no .S files, unbuildable)"
# Same 4.9.112 CAF tree, complete. This is what scripts/build-vendor-kernel.sh uses.
DEVICE_VENDOR_KERNEL_REPO="https://github.com/J0SH1X/android_kernel_xiaomi_olive branch GSI"
DEVICE_VENDOR_KERNEL_VERSION="4.9.112"
DEVICE_VENDOR_KERNEL_DISPLAY="CONFIG_FB_MSM_MDSS (framebuffer, not DRM/KMS)"
DEVICE_VENDOR_KERNEL_DRM_MSM_ENABLED="no"
DEVICE_VENDOR_KERNEL_ADRENO="ADRENO_REV_A505 present in adreno-gpulist.h"
DEVICE_VENDOR_KERNEL_BUILDS="yes - scripts/build-vendor-kernel.sh produces a 30 MB Image + olive DTBs (V30)"
DEVICE_VENDOR_KERNEL_PANEL="dsi_hx8399c_truly_vid, 1080x2160 video mode, 60 Hz, dynamic FPS 48-60"
DEVICE_VENDOR_KERNEL_PANEL_NOTE="DT advertises 1080x2160 but this profile's panel is 720x1520 - unresolved"
DEVICE_VENDOR_KERNEL_TOOLCHAIN="aarch64-linux-gnu-gcc-9 (gcc 11 rejects this 4.9 tree)"
DEVICE_MAINLINE_DSI_STATUS="no working DSI driver for SDM439 (postmarketOS pmaports#4119)"

# --- status -----------------------------------------------------------------
# HONEST STATUS, as of this commit:
#   boot:   NOT SUPPORTED
#   reason: (1) no mainline display driver exists for Adreno 505, so there is
#              no way to light the panel with an upstream kernel - this is a
#              missing-driver problem, not a missing-config one;
#           (2) there is no upstream device tree for olive, so there is no
#              description of this board's regulators, clocks, PHYs or
#              interrupt wiring for a board file to be written against;
#           (3) the bootloader is locked and unlocking is gated on a vendor
#              account and a waiting period.
#
# A "supported" claim for this device would be a lie. What IS done here is the
# part that can be done honestly: the hardware is specified, the required
# kernel features are enumerated, and the build/flash tooling will refuse to
# claim success until a boot has actually been observed.
DEVICE_BOOT_STATUS="unsupported"
DEVICE_BOOT_BLOCKERS="no-mainline-display-driver,no-mainline-dt,locked-bootloader"
DEVICE_VERIFIED_BOOT="no"

# --- what is actually testable on this phone, today --------------------------
# "unsupported" above answers "will Astrix's own kernel light this screen up
# with Astrix's own userspace?" and the answer is no. That is NOT the same as
# "nothing can be done with this phone", and collapsing the two would waste the
# one device most people actually have in their pocket.
#
# There are exactly two honest routes, and they are labelled by what they prove.
#
#   android-host   Run the Astrix USERSpace (compositor + shell + apps) as a
#                  chroot on the phone's own Android kernel, display bridged out
#                  through Termux:X11 -> SurfaceFlinger. This is the route that
#                  gets a real Astrix GUI onto the Redmi 8A today with no
#                  unlock, no flash and no driver work.
#                  PROVES: the compositor, the shell and every app work on this
#                  SoC, this panel geometry and this GPU - via Android's
#                  drivers.
#                  DOES NOT PROVE: anything about Astrix's kernel, bootloader or
#                  drivers. Android is still the kernel. This is NOT booting
#                  Astrix OS.
#
#   no-boot        tests/test-device-panels.sh checks the layout at this
#                  panel's exact 720x1520 geometry with no phone involved.
#                  That one is a pass/fail test today, not a plan.
#
#   boot-test      Flash Astrix's kernel into the phone's boot partition and
#                  boot it, reading the proof off the USB serial console.
#                  PROVES: Astrix's kernel starts on olive, reaches userspace,
#                  and the board enumerates over serial.
#                  DOES NOT PROVE: a picture. There is no Adreno 505 mainline
#                  driver, so the screen stays dark for the whole boot. Android
#                  is replaced until a stock image is reflashed.
#
# Anything else that claims to put a bootable Astrix OS on this phone right now
# is either using someone else's kernel or has not been tried.
DEVICE_TEST_ROUTES="android-host,boot-test,no-boot"
DEVICE_ANDROID_HOST_SUPPORTED="yes"
DEVICE_BOOT_TEST_SUPPORTED="yes"
DEVICE_GUI_PORT_STEPS="enable Termux + Termux:X11,adb push the slim Astrix rootfs,enter the proot chroot,WLR_BACKEND=x11 astrix-compositor,astrix-shell maps a surface"
DEVICE_BOOT_TEST_STEPS="unlock the bootloader with Mi Unlock,build the boot-test image,fastboot flash boot,reboot and read the USB serial log"
DEVICE_BOOT_TEST_CONSOLE="ttyMSM0,115200,8n1 (earlycon)"
DEVICE_BOOT_TEST_CMDLINE="console=ttyMSM0,115200,8n1 earlycon=msm_geni_serial,0x994000 androidboot.hardware=qcom"
DEVICE_BOOT_TEST_EXPECTS_DISPLAY="no"
# Why the screen stays dark. Here it really is the GPU: unlike the moto g64
# 5G's Mali, mainline has no driver for Adreno 5xx in any form.
DEVICE_BOOT_TEST_DARK_REASON="the Adreno 505 has no mainline driver in any form,so the panel has nothing driving it at all"
DEVICE_BOOT_TEST_REFLOWS_ANDROID="yes"

# Notes for whoever does the port. Start from a known-working community port
# rather than from nothing:
#   - postmarketOS has an "olive" port; its kernel config is the realistic
#     starting point for the downstream driver set.
#   - LineageOS's kernel for olive is the other reference.
# Neither is Astrix's kernel, and shipping either would mean shipping someone
# else's work under Astrix's name. What Astrix would contribute is the
# userspace above it.
DEVICE_PORT_REFERENCES="postmarketOS olive port, LineageOS kernel_olive"