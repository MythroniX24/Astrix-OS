# Astrix OS - device profile: Motorola moto g64 5G  (codename "retin")
#
# Read this before assuming anything works on this phone. The hardware facts
# below are real and were checked against vendor and reference sources rather
# than written from memory. The software port does not exist, and exactly why
# is recorded under STATUS rather than left to be discovered with the phone
# sitting in fastboot.
#
# Consumed by scripts/build-device.sh and scripts/flash-device.sh.

# --- identity ---------------------------------------------------------------
DEVICE_NAME="moto g64 5G"
DEVICE_CODENAME="retin"
DEVICE_VARIANTS="XT2431-1 (India/retail), XT2431-2, XT2431-3"
DEVICE_VENDOR="Motorola"
DEVICE_YEAR="2024"
DEVICE_SOC_VENDOR="MediaTek"
DEVICE_SOC="Dimensity 7025 (MT6855 series), 6nm"
DEVICE_ARCH="arm64"

# CPU core layout, from the published SoC specification: 2x Cortex-A78 at
# 2.5GHz + 6x Cortex-A55 at 2.0GHz.
DEVICE_CPU_BIG="Cortex-A78 x2 @ 2.5GHz"
DEVICE_CPU_LITTLE="Cortex-A55 x6 @ 2.0GHz"

# --- panel ------------------------------------------------------------------
# Vendor spec page: 6.5" IPS LCD, Full HD+ 2400x1080, 120Hz.
DEVICE_PANEL_WIDTH=1080
DEVICE_PANEL_HEIGHT=2400
DEVICE_PANEL_REFRESH=120

# --- display link budget ----------------------------------------------------
# What the panel physically demands of the DSI link. This is arithmetic, and
# it is the first gate on the bring-up: a MIPI DSI link cannot carry a panel it
# does not have the bits for, no matter how good the driver is.
#
#   1080x2400 @ 120Hz  ->  376.4 MHz pixel clock (with 10%/10% blanking)
#                     ->  9.03 Gbit/s payload at 24bpp
#                     ->  2.26 Gbit/s per lane on 4 lanes
#                     ->  10% headroom against a 2.5 Gbit/s lane
#
# That is the single most useful number in this file. 120Hz DOES fit, on
# paper, with 10% to spare - and 10% is where DSI link training starts to
# fail in ways that look like a driver bug: ribbon cable length, temperature
# and part-to-part D-PHY variation all eat the margin, and the symptom is a
# panel that lights up on the bench and flickers on the handset.
#
# The recommendation that follows from the arithmetic: bring the panel up at
# 60Hz first (1.13 Gbit/s per lane, 55% headroom), prove the whole chain
# works, and only then chase the 120Hz mode. Run
# scripts/display-budget.sh moto-g64-5g to recompute if any input changes.
#
# PROVENANCE - read this before trusting any of it:
#   W/H/refresh      vendor specification sheet (verified)
#   blanking %       ASSUMED, not measured. No porch values have been read out
#                    of a working boot because there has never been one. Pixel
#                    rate scales linearly with blanking, so a 20% blanking
#                    panel would push this to ~2.2 Gbit/s per lane.
#   lanes / rate     the values the reference port's device tree uses for this
#                    SoC; NOT measured on Astrix hardware.
# Anything above marked ASSUMED must be replaced with real porches from a
# working DT before this is treated as a bring-up plan rather than a sketch.
DEVICE_DSI_LANES=4
DEVICE_DSI_MAX_LINK_RATE=2500000000
DEVICE_DSI_BPP=24
DEVICE_PANEL_HBLANK_PERCENT=10
DEVICE_PANEL_VBLANK_PERCENT=10
DEVICE_DISPLAY_DATA_PROVENANCE="resolution/refresh: vendor spec sheet; blanking: ASSUMED (10%/10%); DSI lanes and per-lane rate: reference port's device tree, not measured"

# --- graphics ---------------------------------------------------------------
# Mali-G57 MC2. Unlike the Adreno in the Redmi, this GPU family DOES have an
# open-source driver: Panfrost, in mainline DRM. That is a real difference and
# it matters - but it is not sufficient, see STATUS.
DEVICE_GPU="Arm Mali-G57 MC2"
DEVICE_GPU_DRIVER_MAINLINE="panfrost (CONFIG_DRM_PANFROST)"
DEVICE_GPU_DRIVER_REQUIRED="panfrost"

# --- bootloader -------------------------------------------------------------
# Motorola ships an official unlock flow: request a token from Motorola's
# developer portal using the device IMEI, then `fastboot flashing unlock`.
# It is far friendlier than Xiaomi's, but it is not instant - the token is
# emailed, and some retail variants have been refused outright with
# "device not qualified". See STATUS.
DEVICE_BOOTLOADER_UNLOCK="Motorola developer portal token (IMEI request, token emailed)"
DEVICE_BOOTLOADER_FASTBOOT="yes (after unlock)"
DEVICE_ROOT_REQUIRED="no"
DEVICE_SUPER_PARTITION="yes"

# --- storage / partitions ---------------------------------------------------
DEVICE_PARTITION_SCHEME="virtual A/B (system-as-root, super partition, dynamic partitions)"
DEVICE_DYNAMIC_PARTITIONS="yes"

# --- storage / SoC drivers that upstream Linux actually has -----------------
# Verified by scripts/device.sh check against config/kernel/config.
#
# The display-path symbols are in this list on purpose. Panfrost without
# CONFIG_DRM_MIPI_DSI and CONFIG_DRM_PANEL_OF still produces a black screen:
# one is the transport, the other is how a panel described in the device tree
# gets turned into a connector. scripts/device.sh check fails if any of them
# is missing from config/kernel/config.
DEVICE_REQUIRED_KERNEL_FEATURES="panfrost,mmc-mtk,ufs-mediatek,phy-mtk-ufs,regulator-mt6392,i2c-mtk,mtk-smi,thermal-mtk,mtk-dvfsrc,drm-mipi-dsi,drm-mipi-dsi-phy,drm-panel-of,drm-panel-bridge,drm-fbdev,uart-mtk,earlycon"

# --- and the ones upstream does NOT have ------------------------------------
# The MT6855 display pipeline is the hard blocker: MediaTek's DSI driver,
# the panel driver, and the GPIO sequence for panel reset/enable have no
# mainline implementation. Panfrost gives a GPU; a GPU with nothing to
# present a scanout to is not a display. Not a configuration problem.
DEVICE_DOWNSTREAM_ONLY_FEATURES="mt6855-dsi-display,retin-panel-driver,retin-device-tree,mt6855-camera,mt6855-vcodec"

# --- status -----------------------------------------------------------------
# HONEST STATUS, as of this commit:
#   boot:   NOT SUPPORTED
#   reason: (1) MediaTek's MT6855 display pipeline (DSI driver, panel driver,
#              GPIO for the panel reset/reg-enable) has no mainline driver.
#              Panfrost would give a GPU, but a GPU with nothing to draw a
#              scanout to is not a display. This is the hard blocker;
#           (2) there is no upstream device tree for retin, so the board's
#              regulators, clocks and interrupt wiring are undescribed;
#           (3) no bootloader exists for it yet - an unlocked Motorola
#              bootloader still only knows how to chainload an Android boot
#              image, so Astrix's own boot chain has to be built.
#
# This is genuinely closer to portable than the Redmi 8A - the GPU driver
# exists - but "closer" is not "supported", and the claim would still be a
# lie. See docs/DEVICES.md for the ordered path from here to a real boot.
DEVICE_BOOT_STATUS="unsupported"
DEVICE_BOOT_BLOCKERS="no-mainline-display-driver,no-mainline-dt,no-bootloader"
DEVICE_VERIFIED_BOOT="no"

# --- what is actually testable on this phone, today --------------------------
# "unsupported" answers "will Astrix's own kernel light this screen with
# Astrix's own userspace?" and the answer is no: MT6855's DSI controller,
# panel driver and reset GPIO sequence are all downstream-only. That is NOT
# the same as "nothing can be done with this phone", and collapsing the two
# would waste the device most people actually have in their pocket.
#
# This board is the better port of the two profiles in this directory, and the
# reason is one fact: the GPU is a Mali-G57 MC2 and **Panfrost is a real
# open-source DRM driver in mainline Linux for it**. The Redmi 8A's Adreno 505
# has nothing. So Astrix has a GPU path here and not there.
#
# A GPU is not a display, though. There is still nothing to present a scanout
# to. So the routes are:
#
#   android-host   Run the Astrix USERSSPACE (compositor + shell + apps) as a
#                  chroot on the phone's own Android kernel, display bridged
#                  out through Termux:X11 -> SurfaceFlinger. Nothing unlocked,
#                  nothing flashed.
#                  PROVES: the GUI works on this SoC and this 1080x2400 panel.
#                  DOES NOT PROVE: anything about Astrix's kernel. Android is
#                  still the kernel. This is NOT booting Astrix OS.
#
#   boot-test      Flash Astrix's kernel into the phone's boot partition and
#                  boot it, reading the proof off the USB serial console.
#                  Motorola's unlock token is far friendlier than Xiaomi's,
#                  which makes this the cheaper of the two boot tests in this
#                  repository.
#                  PROVES: Astrix's kernel starts on retin and reaches
#                  userspace.
#                  DOES NOT PROVE: a picture. Same missing display driver, so
#                  the screen stays dark. Android is replaced until a stock
#                  image is reflashed.
#
#   no-boot        tests/test-device-panels.sh checks the layout at this
#                  panel's exact geometry with no phone involved. That one is
#                  a pass/fail test today, not a plan.
DEVICE_TEST_ROUTES="android-host,boot-test,no-boot"
DEVICE_ANDROID_HOST_SUPPORTED="yes"
DEVICE_BOOT_TEST_SUPPORTED="yes"
DEVICE_GUI_PORT_STEPS="enable Termux + Termux:X11,adb push the slim Astrix rootfs,enter the proot chroot,WLR_BACKEND=x11 astrix-compositor,astrix-shell maps a surface"
DEVICE_BOOT_TEST_STEPS="request the Motorola unlock token with the device IMEI,build the boot-test image,fastboot flash boot,reboot and read the USB serial log,boot-test fb to pull /dev/fb0 and see what the display path drew"
DEVICE_BOOT_TEST_CONSOLE="ttyMSM0,115200,8n1 (earlycon)"
DEVICE_BOOT_TEST_EXPECTS_DISPLAY="no"
# Why the screen stays dark. Not "the GPU is unsupported" - Panfrost drives
# this GPU. It is the display pipeline around it that does not exist upstream.
DEVICE_BOOT_TEST_DARK_REASON="Panfrost does drive the Mali-G57 MC2,so the GPU is not the problem,MT6855's DSI controller and panel driver are downstream-only,so there is nothing to present a scanout to"
DEVICE_BOOT_TEST_REFLOWS_ANDROID="yes"
DEVICE_BOOT_TEST_CMDLINE="console=ttyMSM0,115200,8n1 earlycon=msm_geni_serial,0x994000 androidboot.hardware=qcom"

# Ordered, concrete path from here to a boot. Each step is verifiable on its
# own, which is why it is written down rather than left implicit.
DEVICE_PORT_STEPS="1-upstream-mediatek-display-driver,2-retin-device-tree,3-astrix-bootloader,4-panel-calibration,5-userspace-port"

DEVICE_PORT_REFERENCES="LineageOS device/retin + kernel_mediatek (display + DT reference), Armbian mainline tracker for MT6855"